lifecycle = "2.11.0"
coreKtx = "1.19.1"
datastore = "1.2.1"
tink = "1.24.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
serialization = "1.12.0"
coroutines = "1.11.0"
powersync = "1.15.1"
junit5 = "6.1.3"
turbine = "1.2.1"
