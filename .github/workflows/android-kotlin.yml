name: android-kotlin

on:
  push:
    branches: [dev]
    paths: ['kotlin/**', '.github/workflows/android-kotlin.yml']
  pull_request:
    branches: [dev]
    paths: ['kotlin/**', '.github/workflows/android-kotlin.yml']

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify
        run: ./gradlew :app:testDebugUnitTest ktlintCheck detekt :app:lintDebug :app:assembleDebug :app:assembleRelease
